# Builds self-contained packages for Windows, Linux and macOS on GitHub-hosted
# runners and publishes them as a GitHub Release.
#
# Cut a release:   git tag v2.0.0 && git push origin v2.0.0
# Or manually:     Actions -> Release -> Run workflow -> version 2.0.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 2.0.0). Tag v<version> is created if missing.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  PROJECT: DownloadMaster/DownloadMaster.csproj
  YTDLP_BASE: https://github.com/yt-dlp/yt-dlp/releases/latest/download
  BTBN_BASE: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            raw="$INPUT_VERSION"
          else
            raw="$GITHUB_REF_NAME"
          fi
          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$raw' is not a valid version (expected X.Y.Z or X.Y.Z-suffix)"
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (prerelease: $prerelease)"

  build:
    name: Package ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
            ffmpeg_arch: arm64
          - rid: osx-x64
            os: macos-latest
            ffmpeg_arch: amd64
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      VERSION: ${{ needs.version.outputs.version }}
      PKG_NAME: DownloadMaster-${{ needs.version.outputs.tag }}-${{ matrix.rid }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.rid }}-
            nuget-${{ runner.os }}-

      - name: Publish self-contained single file
        run: |
          dotnet publish "$PROJECT" -c Release -r "$RID" --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:Version="$VERSION" \
            -o out/publish
          rm -f out/publish/tools/ffmpeg/.gitkeep
          ls -la out/publish

      - name: Bundle yt-dlp
        run: |
          case "$RID" in
            win-*)   src=yt-dlp.exe;   dst=yt-dlp.exe ;;
            linux-*) src=yt-dlp_linux; dst=yt-dlp ;;
            osx-*)   src=yt-dlp_macos; dst=yt-dlp ;;
            *) echo "::error::unknown RID $RID"; exit 1 ;;
          esac
          mkdir -p out/publish/tools
          curl -fsSL --retry 3 -o "out/publish/tools/$dst" "$YTDLP_BASE/$src"
          curl -fsSL --retry 3 -o out/SHA2-256SUMS "$YTDLP_BASE/SHA2-256SUMS"
          expected="$(awk -v f="$src" '$2 == f { print $1 }' out/SHA2-256SUMS)"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "out/publish/tools/$dst" | awk '{ print $1 }')"
          else
            actual="$(shasum -a 256 "out/publish/tools/$dst" | awk '{ print $1 }')"
          fi
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::yt-dlp checksum mismatch (expected '$expected', got '$actual')"
            exit 1
          fi
          chmod +x "out/publish/tools/$dst"
          echo "yt-dlp $src -> tools/$dst (sha256 OK)"

      - name: Bundle FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p out/dl out/publish/tools/ffmpeg
          curl -fsSL --retry 3 -o out/dl/ffmpeg.zip "$BTBN_BASE/ffmpeg-master-latest-win64-gpl.zip"
          7z x -y -oout/dl/ffmpeg out/dl/ffmpeg.zip > /dev/null
          for t in ffmpeg ffprobe; do
            f="$(find out/dl/ffmpeg -type f -path "*/bin/$t.exe" | head -n 1)"
            [ -n "$f" ] || { echo "::error::$t.exe not found in BtbN archive"; exit 1; }
            cp "$f" out/publish/tools/ffmpeg/
          done
          ls -la out/publish/tools/ffmpeg

      - name: Bundle FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out/dl/ffmpeg out/publish/tools/ffmpeg
          curl -fsSL --retry 3 -o out/dl/ffmpeg.tar.xz "$BTBN_BASE/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xJf out/dl/ffmpeg.tar.xz -C out/dl/ffmpeg
          for t in ffmpeg ffprobe; do
            f="$(find out/dl/ffmpeg -type f -path "*/bin/$t" | head -n 1)"
            [ -n "$f" ] || { echo "::error::$t not found in BtbN archive"; exit 1; }
            cp "$f" out/publish/tools/ffmpeg/
            chmod +x "out/publish/tools/ffmpeg/$t"
          done
          out/publish/tools/ffmpeg/ffmpeg -hide_banner -version > out/ffmpeg-version.txt && head -n 1 out/ffmpeg-version.txt
          ls -la out/publish/tools/ffmpeg

      # Best effort: static macOS builds by Martin Riedl. If this fails the app
      # still works with a Homebrew FFmpeg (brew install ffmpeg).
      - name: Bundle FFmpeg (macOS, best effort)
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          FFMPEG_ARCH: ${{ matrix.ffmpeg_arch }}
        run: |
          mkdir -p out/dl/mac out/publish/tools/ffmpeg
          for t in ffmpeg ffprobe; do
            curl -fsSL --retry 3 -o "out/dl/$t.zip" \
              "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$FFMPEG_ARCH/release/$t.zip"
            unzip -o -q "out/dl/$t.zip" -d "out/dl/mac/$t"
            f="$(find "out/dl/mac/$t" -type f -name "$t" | head -n 1)"
            [ -n "$f" ] || { echo "$t not found in archive"; exit 1; }
            cp "$f" "out/dl/mac/$t.bin"
          done
          # Only install when both binaries were fetched (the app needs the pair).
          for t in ffmpeg ffprobe; do
            mv "out/dl/mac/$t.bin" "out/publish/tools/ffmpeg/$t"
            chmod +x "out/publish/tools/ffmpeg/$t"
          done
          file out/publish/tools/ffmpeg/* || true

      - name: Warn when macOS FFmpeg is missing
        if: runner.os == 'macOS'
        run: |
          if [ ! -f out/publish/tools/ffmpeg/ffmpeg ] || [ ! -f out/publish/tools/ffmpeg/ffprobe ]; then
            rm -f out/publish/tools/ffmpeg/ffmpeg out/publish/tools/ffmpeg/ffprobe
            echo "::warning::FFmpeg not bundled for $RID - users need 'brew install ffmpeg'."
          fi

      - name: Package (Windows .zip)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp LICENSE THIRD_PARTY_LICENSES.md out/publish/
          cd out/publish
          7z a -tzip -mx=7 "../../dist/$PKG_NAME.zip" * > /dev/null
          cd ../..
          ls -la dist

      - name: Package (Linux .tar.gz)
        if: runner.os == 'Linux'
        run: |
          stage="out/stage/$PKG_NAME"
          mkdir -p "$stage" dist
          cp -R out/publish/. "$stage/"
          cp LICENSE THIRD_PARTY_LICENSES.md "$stage/"
          cp DownloadMaster/Assets/app-icon.png "$stage/downloadmaster.png"
          chmod +x "$stage/DownloadMaster" "$stage/tools/yt-dlp"
          chmod +x "$stage/tools/ffmpeg/ffmpeg" "$stage/tools/ffmpeg/ffprobe"
          tar -czf "dist/$PKG_NAME.tar.gz" -C out/stage "$PKG_NAME"
          tar -tzvf "dist/$PKG_NAME.tar.gz" > out/tar-list.txt && head -n 20 out/tar-list.txt
          ls -la dist

      - name: Package (macOS .app in .zip)
        if: runner.os == 'macOS'
        run: |
          stage="out/stage/$PKG_NAME"
          app="$stage/DownloadMaster.app"
          macos="$app/Contents/MacOS"
          res="$app/Contents/Resources"
          mkdir -p "$macos" "$res" dist

          # The app looks for tools/ next to its executable (Contents/MacOS/tools).
          cp -R out/publish/. "$macos/"
          rm -f "$macos/tools/README.txt"
          chmod +x "$macos/DownloadMaster" "$macos/tools/yt-dlp"
          chmod +x "$macos"/tools/ffmpeg/* 2>/dev/null || true
          cp LICENSE THIRD_PARTY_LICENSES.md "$res/"

          # Icon: center-crop the PNG to a square, then build an .icns.
          make_icon() {
            local src=DownloadMaster/Assets/app-icon.png
            local work=out/icon iconset=out/icon/DownloadMaster.iconset
            mkdir -p "$iconset"
            local w h s
            w="$(sips -g pixelWidth "$src" | awk '/pixelWidth/ { print $2 }')"
            h="$(sips -g pixelHeight "$src" | awk '/pixelHeight/ { print $2 }')"
            s=$(( w < h ? w : h ))
            sips -s format png -c "$s" "$s" "$src" --out "$work/square.png" > /dev/null
            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" "$work/square.png" --out "$iconset/icon_${size}x${size}.png" > /dev/null
              sips -z $((size * 2)) $((size * 2)) "$work/square.png" --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
            done
            iconutil -c icns "$iconset" -o "$res/DownloadMaster.icns"
          }
          make_icon || echo "::warning::Could not build the .icns icon; the app will use the default icon."

          # CFBundleVersion must be numeric (strip -beta / +build suffixes).
          short="${VERSION%%[-+]*}"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>DownloadMaster</string>
            <key>CFBundleDisplayName</key>
            <string>DownloadMaster</string>
            <key>CFBundleIdentifier</key>
            <string>live.satisfy.downloadmaster</string>
            <key>CFBundleExecutable</key>
            <string>DownloadMaster</string>
            <key>CFBundleIconFile</key>
            <string>DownloadMaster.icns</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleShortVersionString</key>
            <string>${short}</string>
            <key>CFBundleVersion</key>
            <string>${short}</string>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.utilities</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
            <key>NSHumanReadableCopyright</key>
            <string>Copyright (c) 2026 mothannakh - https://satisfy.live/</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"

          # Ad-hoc signature (no Apple Developer ID). Keeps Gatekeeper's
          # "Open Anyway" path available instead of the "app is damaged" error.
          for f in "$macos/tools/yt-dlp" "$macos/tools/ffmpeg/ffmpeg" "$macos/tools/ffmpeg/ffprobe"; do
            [ -f "$f" ] || continue
            codesign -v "$f" 2>/dev/null || codesign --force --sign - "$f" || echo "::warning::could not sign $f"
          done
          codesign --force --sign - "$app" || echo "::warning::ad-hoc signing of the app bundle failed"
          codesign --verify --verbose "$app" || true

          cp LICENSE THIRD_PARTY_LICENSES.md "$stage/"
          cat > "$stage/README-macOS.txt" <<'EOF'
          DownloadMaster for macOS
          ========================

          1. Drag DownloadMaster.app into /Applications.
          2. The app is not notarized by Apple. The first time, right-click the app
             and choose Open (on macOS 15+: try to open it once, then go to
             System Settings > Privacy & Security and click "Open Anyway").
             Or run in Terminal:
               xattr -dr com.apple.quarantine /Applications/DownloadMaster.app
          3. FFmpeg is bundled when available. If the app reports FFmpeg missing:
               brew install ffmpeg yt-dlp
          EOF

          ditto -c -k --sequesterRsrc --keepParent "$stage" "dist/$PKG_NAME.zip"
          ls -la dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Package browser extension (Chrome / Edge)
        run: |
          stage=out/browser-extension
          mkdir -p "$stage"
          cp -R browser-extension/. "$stage/"
          rm -f "$stage/README.md"
          # Chrome only accepts numeric versions (e.g. 2.0.0 from v2.0.0-beta.1).
          ext_version="$(printf '%s' "$VERSION" | sed -E 's/^([0-9]+(\.[0-9]+){0,3}).*/\1/')"
          python3 - "$stage/manifest.json" "$ext_version" <<'PY'
          import json, sys
          path, version = sys.argv[1], sys.argv[2]
          manifest = json.load(open(path))
          manifest["version"] = version
          json.dump(manifest, open(path, "w"), indent=2)
          PY
          (cd "$stage" && zip -q -r -X "../../dist/DownloadMaster-$TAG-browser-extension.zip" .)
          ls -la dist

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          mkdir -p out
          notes=out/release-notes.md
          if [ -f docs/release-notes-template.md ]; then
            date_str="$(date -u '+%B %-d, %Y')"
            sed -e "s|{{VERSION}}|$TAG|g" -e "s|{{DATE}}|$date_str|g" \
              docs/release-notes-template.md > "$notes"
          else
            printf '## DownloadMaster %s\n' "$TAG" > "$notes"
          fi
          cat "$notes"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: DownloadMaster ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: out/release-notes.md
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: dist/*
